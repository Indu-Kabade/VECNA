  <g id="vecna-v-mark">
    <!-- Left White Wing -->
    <path 
      d="M 116 168 L 186 168 C 195 168 202 174 206 182 L 250 338 C 255 356 244 374 226 374 C 218 374 212 368 208 360 L 120 180 C 114 172 118 168 116 168 Z" 
