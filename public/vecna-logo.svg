  <!-- Orbit Ring Top Arc with Dot -->
  <path d="M 165 142 A 170 170 0 0 1 328 132" stroke="#71CF8F" stroke-width="7" stroke-linecap="round"/>
  <circle cx="338" cy="134" r="12" fill="#71CF8F"/>

  <!-- Orbit Ring Bottom Arc with Dot -->
  <path d="M 347 370 A 170 170 0 0 1 184 380" stroke="#71CF8F" stroke-width="7" stroke-linecap="round"/>
  <circle cx="174" cy="378" r="12" fill="#71CF8F"/>

  <!-- "V" Left Arm (Crisp White/Ivory Ribbon) -->
  <path d="M 118 168 C 118 168 184 168 190 174 C 196 180 236 348 244 366 C 248 374 256 376 264 372 C 274 368 252 320 252 320 L 222 170 C 220 162 214 158 206 158 L 126 158 C 118 158 114 164 118 168 Z" fill="#F4F8F4"/>
  
  <!-- "V" Left Stroke Precision Polygon/Path matching the uploaded image exactly -->
